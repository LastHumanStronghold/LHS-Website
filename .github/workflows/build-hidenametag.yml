name: Build HideNametag

on:
  push:
    branches:
      - build-hide-nametag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        working-directory: HideNametag
        run: mvn -B clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HideNametag-1.0.0
          path: HideNametag/target/HideNametag-1.0.0.jar
      - name: Publish JAR to branch
        run: |
          cp HideNametag/target/HideNametag-1.0.0.jar HideNametag-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HideNametag-1.0.0.jar
          git diff --cached --quiet && exit 0
          git commit -m "Build HideNametag 1.0.0 JAR"
          git push
